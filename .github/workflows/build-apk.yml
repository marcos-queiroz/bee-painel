name: Build Android APK

on:
  push:
    branches: [build] # mudar para main quando estiver pronto
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Delete previous APK artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'beepainel-release-apk';
            let page = 1;

            while (true) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: artifactName,
                per_page: 100,
                page,
              });

              if (data.artifacts.length === 0) break;

              for (const artifact of data.artifacts) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                core.info(`Deleted artifact ${artifact.id}`);
              }

              if (data.artifacts.length < 100) break;
              page++;
            }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: beepainel-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
          if-no-files-found: error
